<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Embedding Atlas — 128D, sampled</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f9f9f7; color: #0b0b0b; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 34px 28px 40px; }
  header h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  p.hint { font-size: 13.5px; line-height: 1.6; color: #52514e; max-width: 76ch; margin: 8px 0 0; }
  .hypctl { display: flex; align-items: center; gap: 12px; margin: 18px 0 0;
            font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: #898781; }
  .hypctl input[type="range"] { width: 240px; accent-color: #2a78d6; }
  .hypctl span { font-size: 13.5px; letter-spacing: 0; text-transform: none;
                 font-variant-numeric: tabular-nums; color: #0b0b0b; min-width: 76px; }
  .hypctl button { margin-left: auto; font: inherit; color: #52514e; background: #fcfcfb;
                   border: 1px solid rgba(11,11,11,0.14); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .hypctl button:hover { border-color: rgba(11,11,11,0.3); color: #0b0b0b; }
  .hyplegend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 12px 0 0;
               font-size: 12.5px; color: #52514e; }
  .hyplegend .item { display: inline-flex; align-items: center; gap: 7px; }
  .hyplegend .sw { display: inline-block; }
  .hyplegend .sw-line { width: 18px; height: 2px; border-radius: 1px; }
  .hyplegend .sw-point { width: 10px; height: 10px; border-radius: 50%; }
  .hyplegend .sw-circle { width: 9px; height: 9px; border-radius: 50%; border: 2px solid; }
  .hyplegend .sw-area { width: 12px; height: 12px; border-radius: 3px; border: 1px solid; }
  .hyplegend .sw-arrow { font-weight: 700; font-size: 15px; line-height: 1; }
  #app { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
  .hypview { position: relative; flex: 1 1 460px; height: 560px; overflow: hidden;
             border: 1px solid rgba(11,11,11,0.10); border-radius: 10px; background: #fcfcfb;
             box-shadow: 0 1px 3px rgba(11,11,11,0.05); }
  .hypview canvas { display: block; width: 100%; height: 100%; }
  .viewtag { position: absolute; top: 12px; left: 14px; color: #898781; font-size: 11.5px;
             letter-spacing: 0.06em; text-transform: uppercase; pointer-events: none; }
  .hyplabel { position: absolute; transform: translate(-50%, -160%); font-size: 13px; color: #0b0b0b;
              pointer-events: none; white-space: nowrap; text-shadow: 0 0 4px #fcfcfb, 0 0 2px #fcfcfb; }
  .hyptooltip { position: fixed; display: none; z-index: 10; pointer-events: none;
                background: #0b0b0b; color: #fcfcfb; font-size: 12.5px; padding: 4px 9px;
                border-radius: 5px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  footer { margin-top: 14px; font-size: 12px; color: #898781; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Embedding Atlas — 128D, sampled</h1>
    <p class="hint">Hover a node for its label and pruned-leaf count; click a node to highlight its ancestor chain.  showing 4,000 of 24,278 nodes (16%) — hover for pruned-leaf counts · projected 128D → 2D (radius-preserving, depth↔radius exact).</p>
  </header>
  <div id="app"></div>
  <footer>made with hypviz</footer>
</div>
