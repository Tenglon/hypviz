<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>/*TITLE*/</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f9f9f7; color: #0b0b0b; }
  h1 { font-size: 17px; font-weight: 600; padding: 14px 18px 2px; margin: 0; }
  p.hint { font-size: 13px; color: #52514e; padding: 0 18px; margin: 2px 0 6px; }
  .hypctl { display: flex; align-items: center; gap: 10px; padding: 2px 18px 6px;
            font-size: 13px; color: #52514e; }
  .hypctl input[type="range"] { width: 220px; accent-color: #2a78d6; }
  .hypctl span { font-variant-numeric: tabular-nums; color: #0b0b0b; }
  #app { display: flex; gap: 10px; padding: 4px 10px 10px; }
  .hypview { position: relative; flex: 1; height: 540px; overflow: hidden;
             border: 1px solid rgba(11,11,11,0.10); border-radius: 6px; background: #fcfcfb; }
  .hypview canvas { display: block; width: 100%; height: 100%; }
  .viewtag { position: absolute; top: 8px; left: 12px; color: #898781; font-size: 13px; pointer-events: none; }
  .hyplabel { position: absolute; transform: translate(-50%, -160%); font-size: 13px; color: #0b0b0b;
              pointer-events: none; white-space: nowrap; text-shadow: 0 0 4px #fcfcfb, 0 0 2px #fcfcfb; }
</style>
</head>
<body>
<h1>/*TITLE*/</h1>
<p class="hint">Drag the highlighted points — in either view. The 3D view orbits/zooms with the mouse.</p>
<div id="app"></div>
<script>/*RUNTIME*/</script>
<script>HypVizRuntime.mount(document.getElementById("app"), /*SCENE*/);</script>
</body>
</html>
