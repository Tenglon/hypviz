<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>/*TITLE*/</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  h1 { font-size: 17px; font-weight: 600; padding: 12px 16px 4px; margin: 0; }
  p.hint { font-size: 13px; opacity: 0.55; padding: 0 16px; margin: 0 0 4px; }
  #app { display: flex; gap: 8px; padding: 8px; }
  .hypview { position: relative; flex: 1; height: 540px; overflow: hidden; }
  .hypview canvas { display: block; width: 100%; height: 100%; }
  .viewtag { position: absolute; top: 8px; left: 12px; opacity: 0.55; font-size: 13px; pointer-events: none; }
  .hyplabel { position: absolute; transform: translate(-50%, -160%); font-size: 13px;
              pointer-events: none; white-space: nowrap; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<h1>/*TITLE*/</h1>
<p class="hint">Drag the highlighted points — in either view. The 3D view orbits/zooms with the mouse.</p>
<div id="app"></div>
<script>/*RUNTIME*/</script>
<script>HypVizRuntime.mount(document.getElementById("app"), /*SCENE*/);</script>
</body>
</html>
