[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypviz"
version = "0.0.1"
description = "Interactive visualizations of hyperbolic machine learning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Teng Long" }]
dependencies = ["numpy>=1.21", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]
examples = ["nltk", "gensim"]        # real-data demos: WordNet + trained Poincaré embeddings

[tool.hatch.build.targets.wheel]
packages = ["src/hypviz"]
